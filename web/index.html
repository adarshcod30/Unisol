<!doctype html>
<meta charset="utf-8">
<title>SpecLedger — Unisol</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{
  --bg:#0d1117; --panel:#161b22; --panel2:#1c2128; --line:#30363d;
  --fg:#e6edf3; --dim:#8b949e; --accent:#2f81f7; --cyan:#39d0d8;
  --ok:#3fb950; --warn:#d29922; --bad:#f85149; --hl:#ffd33d;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
  font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif}
header{display:flex;align-items:center;gap:18px;padding:12px 20px;
  border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:9}
.logo{font-weight:700;letter-spacing:-.02em;font-size:16px}
.logo span{color:var(--cyan)}
.tag{color:var(--dim);font-size:12px}
nav{margin-left:auto;display:flex;gap:4px}
nav button{background:transparent;border:1px solid transparent;color:var(--dim);
  padding:6px 13px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:500}
nav button:hover{color:var(--fg);background:var(--panel2)}
nav button.on{background:var(--accent);color:#fff}
.stats{display:flex;gap:16px;flex-wrap:wrap;padding:10px 20px;
  border-bottom:1px solid var(--line);background:var(--panel2);font-size:12px}
.stat b{color:var(--fg);font-size:15px;font-variant-numeric:tabular-nums}
.stat i{color:var(--dim);font-style:normal;margin-left:5px}
main{display:grid;grid-template-columns:236px minmax(420px,1fr) minmax(340px,520px);
  height:calc(100vh - 96px)}
@media(max-width:1100px){main{grid-template-columns:1fr}}
.col{overflow-y:auto;padding:14px}
.col+.col{border-left:1px solid var(--line)}
h3{margin:0 0 10px;font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--dim)}
.sku{padding:8px 10px;border-radius:6px;cursor:pointer;border:1px solid transparent;margin-bottom:3px}
.sku:hover{background:var(--panel2)}
.sku.on{background:var(--panel2);border-color:var(--accent)}
.sku .id{font-family:var(--mono);font-size:12px;font-weight:600}
.sku .meta{color:var(--dim);font-size:11px;margin-top:2px}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;
  color:var(--dim);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top;font-size:13px}
tr.row{cursor:pointer}
tr.row:hover td{background:var(--panel2)}
tr.on td{background:#132030}
.val{font-family:var(--mono);font-weight:600}
.badge{display:inline-block;padding:1px 7px;border-radius:20px;font-size:10px;
  font-weight:700;letter-spacing:.04em}
.AUTO_PUBLISH{background:rgba(63,185,80,.16);color:var(--ok)}
.REVIEW{background:rgba(210,153,34,.16);color:var(--warn)}
.REJECT{background:rgba(248,81,73,.16);color:var(--bad)}
.crit{color:var(--bad);font-weight:700;margin-left:4px}
.bar{height:3px;background:var(--line);border-radius:2px;margin-top:5px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.ev{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:12px}
.quote{font-family:var(--mono);font-size:12px;background:#0b1622;border-left:3px solid var(--hl);
  padding:9px 11px;border-radius:0 5px 5px 0;white-space:pre-wrap;word-break:break-word;
  max-height:190px;overflow:auto;color:#cbd5e1}
.pg{width:100%;border-radius:6px;border:1px solid var(--line);background:#fff;margin-top:10px;display:block}
.why{list-style:none;padding:0;margin:8px 0 0}
.why li{font-size:12px;color:var(--dim);padding:3px 0 3px 15px;position:relative}
.why li:before{content:"›";position:absolute;left:2px;color:var(--accent)}
.why li.bad:before{content:"✕";color:var(--bad)}
.why li.good:before{content:"✓";color:var(--ok)}
.k{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.chip{display:inline-block;font-family:var(--mono);font-size:11px;background:var(--panel2);
  border:1px solid var(--line);border-radius:4px;padding:1px 6px;margin:2px 3px 0 0}
.chip.warn{border-color:var(--warn);color:var(--warn)}
.acts{display:flex;gap:7px;margin-top:11px}
.acts button{flex:1;padding:7px;border-radius:6px;border:1px solid var(--line);
  background:var(--panel2);color:var(--fg);cursor:pointer;font-size:12px;font-weight:600}
.acts .a{border-color:var(--ok);color:var(--ok)} .acts .a:hover{background:rgba(63,185,80,.12)}
.acts .r{border-color:var(--bad);color:var(--bad)} .acts .r:hover{background:rgba(248,81,73,.12)}
.qitem{border:1px solid var(--line);border-radius:7px;padding:10px;margin-bottom:8px;
  cursor:pointer;background:var(--panel)}
.qitem:hover{border-color:var(--accent)}
.qitem.on{border-color:var(--accent);background:#132030}
.risk{float:right;font-family:var(--mono);font-size:11px;color:var(--warn)}
.wide{padding:20px;overflow-y:auto;height:calc(100vh - 96px)}
.mt{width:100%;max-width:940px;border-collapse:collapse;margin-bottom:26px}
.mt td,.mt th{padding:8px 12px;border-bottom:1px solid var(--line);font-size:13px}
.mt .num{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}
.win{color:var(--ok);font-weight:700} .lose{color:var(--bad)}
.muted{color:var(--dim)}
a{color:var(--accent)}
.empty{color:var(--dim);padding:30px;text-align:center;font-size:13px}
</style>
<header>
  <div class="logo">Spec<span>Ledger</span></div>
  <div class="tag">Verifiable product intelligence · team Unisol</div>
  <nav>
    <button id="t-cat" class="on" onclick="tab('cat')">Catalog</button>
    <button id="t-q" onclick="tab('q')">Review queue</button>
    <button id="t-m" onclick="tab('m')">Evaluation</button>
  </nav>
</header>
<div class="stats" id="stats"></div>

<main id="v-cat">
  <div class="col"><h3>Catalog</h3><div id="skus"></div></div>
  <div class="col"><h3 id="rec-h">Record</h3><div id="rec"></div></div>
  <div class="col"><h3>Evidence</h3><div id="ev"><div class="empty">Select an attribute to see the source sentence.</div></div></div>
</main>

<main id="v-q" style="display:none">
  <div class="col" style="grid-column:span 2"><h3>Ranked by risk = uncertainty × safety × conflict</h3><div id="queue"></div></div>
  <div class="col"><h3>Evidence</h3><div id="qev"><div class="empty">Select a queued item.</div></div></div>
</main>

<div class="wide" id="v-m" style="display:none"><div id="metrics"></div></div>

<script>
const $=(s)=>document.querySelector(s), api=(p)=>fetch(p).then(r=>r.json());
let RECS=[], CUR=null, CURATTR=null;

function tab(t){
  for(const k of ['cat','q','m']){
    $('#v-'+k).style.display = k===t ? (k==='m'?'block':'grid') : 'none';
    $('#t-'+k).classList.toggle('on', k===t);
  }
  if(t==='q') loadQueue();
  if(t==='m') loadMetrics();
}
const pct=(x)=> (100*x).toFixed(1)+'%';

async function boot(){
  const h = await api('/api/health'); const c = h.catalog||{};
  $('#stats').innerHTML = [
    ['records', c.records], ['attributes', c.attributes],
    ['auto-published', c.auto_published], ['in review', c.in_review],
    ['conflicts flagged', c.conflicting], ['multi-source', c.multi_source],
    ['provenance', pct(c.provenance_coverage||0)],
    ['LLM extractor', h.llm_extractor]
  ].map(([k,v])=>`<div class="stat"><b>${v??'—'}</b><i>${k}</i></div>`).join('');
  RECS = await api('/api/records');
  $('#skus').innerHTML = RECS.map(r=>`
    <div class="sku" id="s-${r.sku}" onclick="openSku('${r.sku}')">
      <div class="id">${r.mpn}</div>
      <div class="meta">${r.brand} · ${r.published}/${r.attributes} published${r.conflicts?` · ${r.conflicts}⚠`:''}</div>
    </div>`).join('');
  if(RECS.length) openSku(RECS[0].sku);
}

async function openSku(sku){
  CUR=sku;
  document.querySelectorAll('.sku').forEach(e=>e.classList.remove('on'));
  $('#s-'+sku)?.classList.add('on');
  const r = await api('/api/records/'+sku);
  $('#rec-h').textContent = `${r.brand} ${r.mpn} — ${r.product_class.replace(/_/g,' ').toLowerCase()}`;
  const rows = Object.entries(r.attributes).map(([k,a])=>`
    <tr class="row" id="a-${k}" onclick="showEv('${sku}','${k}')">
      <td>${a.label}${a.safety_critical?'<span class="crit" title="safety-critical">▲</span>':''}
          <div class="k">${k}</div></td>
      <td class="val">${a.display||'—'}
          ${a.conflicting?`<div class="chip warn">conflict: ${(a.conflict_values||[]).slice(0,2).join(' / ')}</div>`:''}</td>
      <td><span class="badge ${a.decision}">${a.decision.replace('_',' ')}</span>
          <div class="bar"><i style="width:${(100*a.confidence).toFixed(0)}%"></i></div>
          <div class="k">${a.confidence.toFixed(3)}</div></td>
    </tr>`).join('');
  $('#rec').innerHTML = `
    <div class="ev"><span class="k">input</span><div style="margin-top:4px">“${r.input_description}”</div>
      <div style="margin-top:8px">${r.docs.map(d=>`<span class="chip">${d.publisher}</span>`).join('')}</div>
      <div style="margin-top:8px"><span class="k">AI-search readiness</span>
        <b style="margin-left:6px">${r.readiness.score}</b>
        <span class="muted">/100 · ${r.readiness.attributes_published} published, ${r.readiness.attributes_withheld} withheld</span></div>
      ${(r.notes||[]).map(n=>`<div class="k" style="margin-top:6px;color:var(--warn)">${n}</div>`).join('')}
    </div>
    <table><tr><th>attribute</th><th>value</th><th>decision</th></tr>${rows}</table>`;
}

async function showEv(sku, attr, target='#ev'){
  CURATTR=attr;
  document.querySelectorAll('tr.row').forEach(e=>e.classList.remove('on'));
  $('#a-'+attr)?.classList.add('on');
  const r = await api('/api/records/'+sku); const a = r.attributes[attr];
  const e = a.evidence;
  const why = (a.reasons||[]).map(x=>{
    const cls = /auto-published|agree|column|section/.test(x) ? 'good'
              : /conflict|quarantin|violation|rejected/.test(x) ? 'bad' : '';
    return `<li class="${cls}">${x}</li>`;
  }).join('');
  $(target).innerHTML = `
    <div class="ev">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <b>${a.label}</b><span class="badge ${a.decision}">${a.decision.replace('_',' ')}</span>
      </div>
      <div class="val" style="font-size:20px;margin:6px 0">${a.display||'—'}</div>
      ${e?`<div class="k">${e.doc_id} · page ${e.page} · chars ${e.char_start}–${e.char_end} · match ${e.match_mode}</div>
           <div class="quote">${(e.quote||'').replace(/</g,'&lt;')}</div>`:'<div class="muted">no evidence</div>'}
      ${a.quarantined?.length?`<div style="margin-top:8px"><span class="k">quarantined</span>
          ${a.quarantined.map(q=>`<span class="chip warn">${q}</span>`).join('')}</div>`:''}
      ${a.rejected_provenance?.length?`<div style="margin-top:6px">${a.rejected_provenance
          .map(q=>`<div class="k" style="color:var(--warn)">✕ ${q}</div>`).join('')}</div>`:''}
      <ul class="why">${why}</ul>
      <div class="acts">
        <button class="a" onclick="act('${sku}','${attr}','ACCEPT')">Accept</button>
        <button class="r" onclick="act('${sku}','${attr}','REJECT')">Reject</button>
      </div>
    </div>
    ${e?`<img class="pg" src="/api/evidence/${sku}/${attr}.png" alt="source page ${e.page} with the supporting sentence highlighted">`:''}`;
}

async function act(sku, attribute, action){
  await fetch('/api/review',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({sku,attribute,action,actor:'demo-reviewer'})});
  await openSku(sku); await showEv(sku,attribute); loadQueue();
}

async function loadQueue(){
  const q = await api('/api/queue');
  $('#queue').innerHTML = q.length ? q.map((i,n)=>`
    <div class="qitem" id="q-${n}" onclick="pickQ(${n},'${i.sku}','${i.attribute}')">
      <span class="risk">risk ${i.risk.toFixed(2)}</span>
      <b>${i.brand} ${i.mpn}</b> — ${i.attribute}
      ${i.safety_critical?'<span class="crit">▲ safety-critical</span>':''}
      <div class="k" style="margin-top:4px">proposed <span class="val">${i.display||'—'}</span>
        ${i.conflicting?` · conflicts with ${i.conflict_values.slice(0,2).join(' / ')}`:''}
        · confidence ${i.confidence.toFixed(3)}</div>
    </div>`).join('') : '<div class="empty">Queue is clear — everything cleared the precision floor.</div>';
}
function pickQ(n,sku,attr){
  document.querySelectorAll('.qitem').forEach(e=>e.classList.remove('on'));
  $('#q-'+n)?.classList.add('on');
  showEv(sku,attr,'#qev');
}

async function loadMetrics(){
  const m = await api('/api/metrics');
  if(m.error){ $('#metrics').innerHTML=`<div class="empty">${m.error}</div>`; return; }
  const [n,s]=m.arms;
  const row=(k,a,b,better)=>{
    const cls = better==='b'?'win':better==='a'?'lose':'';
    return `<tr><td>${k}</td><td class="num muted">${a}</td><td class="num ${cls}">${b}</td></tr>`;};
  const curve = m.risk_coverage_curve.filter((p,i,arr)=>p.coverage>0 &&
      (i===0 || Math.abs(p.coverage-arr[i-1].coverage)>0.01));
  const W=560,H=180;
  const pts = curve.map(p=>`${20+(W-40)*p.coverage},${H-20-(H-40)*((p.precision-0.9)/0.1)}`).join(' ');
  $('#metrics').innerHTML=`
    <h3>Measured on ${m.corpus.skus} SKUs across ${m.corpus.documents} real vendor datasheets</h3>
    <table class="mt">
      <tr><th>metric</th><th class="num">naive extraction</th><th class="num">SpecLedger</th></tr>
      ${row('attributes graded', n.attributes_labelled, s.attributes_labelled)}
      ${row('coverage', pct(n.coverage), pct(s.coverage))}
      ${row('auto-publish rate', pct(n.auto_publish_rate), pct(s.auto_publish_rate))}
      ${row('precision on published', pct(n.precision_on_published), pct(s.precision_on_published),'b')}
      ${row('safety-critical precision', pct(n.safety_precision_on_published), pct(s.safety_precision_on_published),'b')}
      ${row('WRONG values published', n.wrong_values_published, s.wrong_values_published,'b')}
      ${row('queued for human review', n.queued_for_review, s.queued_for_review)}
      ${row('calibration error (ECE)', n.ece, s.ece,'b')}
    </table>
    <h3>Risk–coverage frontier — the knob a distributor actually turns</h3>
    <svg width="${W}" height="${H}" style="background:var(--panel);border:1px solid var(--line);border-radius:8px">
      <polyline points="${pts}" fill="none" stroke="var(--cyan)" stroke-width="2"/>
      ${curve.map(p=>`<circle cx="${20+(W-40)*p.coverage}" cy="${H-20-(H-40)*((p.precision-0.9)/0.1)}" r="3" fill="var(--accent)"><title>coverage ${pct(p.coverage)} · precision ${pct(p.precision)}</title></circle>`).join('')}
      <text x="20" y="${H-4}" fill="var(--dim)" font-size="10">coverage →</text>
      <text x="20" y="12" fill="var(--dim)" font-size="10">precision 100%</text>
      <text x="20" y="${H-24}" fill="var(--dim)" font-size="10">90%</text>
    </svg>
    <table class="mt" style="margin-top:20px">
      <tr><th>threshold</th><th class="num">coverage</th><th class="num">precision</th></tr>
      ${curve.map(p=>`<tr><td class="num">${p.threshold.toFixed(2)}</td>
        <td class="num">${pct(p.coverage)}</td><td class="num">${pct(p.precision)}</td></tr>`).join('')}
    </table>
    ${m.errors_published_by_specledger?.length?`<h3>Errors SpecLedger still published (full disclosure)</h3>
      <table class="mt">${m.errors_published_by_specledger.map(e=>`<tr><td>${e.sku}</td><td>${e.attribute}</td>
      <td class="num lose">${e.got}</td><td class="num muted">gold ${JSON.stringify(e.gold)}</td></tr>`).join('')}</table>`:''}
    <h3>Learned feature weights</h3>
    <table class="mt">${Object.entries(m.feature_weights||{}).sort((a,b)=>Math.abs(b[1])-Math.abs(a[1]))
      .map(([k,v])=>`<tr><td>${k}</td><td class="num ${v>0?'win':'lose'}">${v>0?'+':''}${v}</td></tr>`).join('')}</table>`;
}
boot();
</script>
